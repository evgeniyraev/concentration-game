name: Build Windows application

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example, 1.0.1)'
        required: true
        type: string
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set release version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $requestedVersion = $env:GITHUB_REF_NAME
          } else {
            $requestedVersion = $env:REQUESTED_VERSION
          }
          $version = $requestedVersion.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release version must use MAJOR.MINOR.PATCH format. Received: $requestedVersion"
          }
          npm version $version --no-git-tag-version --allow-same-version
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=v$version" >> $env:GITHUB_ENV

      - name: Build Windows installer
        run: npm run dist -- --publish never

      - name: Verify release assets
        shell: pwsh
        run: |
          $expectedAssets = @(
            "dist/Max-and-Mila-Setup-$env:RELEASE_VERSION.exe"
            "dist/Max-and-Mila-Setup-$env:RELEASE_VERSION.exe.blockmap"
            "dist/latest.yml"
          )
          foreach ($asset in $expectedAssets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw "Expected release asset was not produced: $asset"
            }
          }

      - name: Publish GitHub release
        shell: pwsh
        run: |
          $assets = @(
            (Resolve-Path "dist/Max-and-Mila-Setup-$env:RELEASE_VERSION.exe").Path
            (Resolve-Path "dist/Max-and-Mila-Setup-$env:RELEASE_VERSION.exe.blockmap").Path
            (Resolve-Path "dist/latest.yml").Path
          )
          gh release create $env:RELEASE_TAG @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title $env:RELEASE_VERSION --generate-notes
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to publish GitHub release $env:RELEASE_TAG"
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: max-and-mila-windows
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

